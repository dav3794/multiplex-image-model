encoder:
    # marker-agnostic part
    ma_layers_blocks: [4,]
    ma_embedding_dims: [16,]
    # pan-marker part
    pm_layers_blocks: [4, 4, 4]
    pm_embedding_dims: [192, 384, 768]

    hyperkernel:
      kernel_size: 1
      padding: 0
      stride: 1
      use_bias: true
      low_rank: false
      rank: null

    # Continuous vMF projection head for the iBOT objective (required for this training)
    ibot_head: true
    ibot_head_config:
      out_dim: 256
      hidden_dim: 2048
      n_layers: 3
    # What the vMF iBOT head consumes: "dense" (every latent cell) or "pooled" (pooled latent)
    ibot_mode: dense
    # Student vMF predictor
    ibot_predictor_config:
      hidden_dim: 2048
      n_layers: 2

decoder:
  decoded_embed_dim: 512
  num_blocks: 1

  hyperkernel:
      kernel_size: 1
      padding: 0
      stride: 1
      use_bias: true
      low_rank: false
      rank: null

# Data configuration
panel_config: configs/all_panels_config.yaml
tokenizer_config: configs/all_markers_tokenizer.yaml
input_image_size: [128, 128]
num_workers: 4
batch_size: 8

data_config:
  preprocessing_func: null
  scaling_func: percentile
  denoising_func: butterworth
  normalization_func: null
  operation_order: [transform, denoising, scaling]
  file_extension: npy
  preprocessing_kwargs: {}
  denoising_kwargs: {}
  scaling_kwargs: {}
  normalization_kwargs: {}

# Training configuration
device: cuda
lr: 5e-4
final_lr: 1e-5
weight_decay: 0.0001
gradient_accumulation_steps: 1
epochs: 10
frac_warmup_steps: 0.1
min_channels_frac: 0.75
spatial_masking_ratio: 0.6
fully_masked_channels_max_frac: 0.5
mask_patch_size: 8
from_checkpoint: null
checkpoints_dir: checkpoints
save_checkpoint_freq: 5
beta: 0.5

# vMF iBOT self-distillation configuration
num_global_views: 2
recon_loss_weight: 1.0
ibot_loss_weight: 0.01
koleo_loss_weight: 0.1
ibot_beta: 0.5
center_momentum: 0.9
koleo_max_samples: null
momentum_teacher: 0.996

# Comet.ml logging configuration
tags: ["ibot-vmf"]
comet_project: immuvis
comet_workspace: null # optional, can also be set via COMET_WORKSPACE env var
comet_api_key: null  # set via COMET_API_KEY env var
run_name: 'ImmuVis-iBOT-vMF-001'
