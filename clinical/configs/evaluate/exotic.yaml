output_dir: /storage_ssd_3/immuvis_clinical/exotic_results

clinical_data:
  path: /raid_encrypted/immucan/evaluation/predict_clinical/configs/immuvis/train_meta_table.csv

datasets:
  danenberg:
    features: [ERBB2_pos, ERStatus, Grade, PAM50]
  cords:
    features: [DX.name, Grade, Relapse]

preprocessing:
  variants: [scaled]
  rare_class_threshold: 0.05
  seed: 42
  feature_prefix: "f_"

cross_validation:
  n_folds: 10
  seed: 42

models:
  - name: kronecker_learnmask_gp
    format: immuvis
    path: /storage_ssd_3/immuvis_clinical/kronecker_emb
    panels: [danenberg, cords]
    img_path_col: img_path
    batch_agg: mean
    patch_agg: mean
    variants: [scaled]

  - name: vit_lp
    format: immuvis
    path: /storage_ssd_3/immuvis_clinical/vit_lp_emb
    panels: [danenberg, cords]
    img_path_col: img_path
    batch_agg: mean
    patch_agg: mean
    variants: [scaled]

  - name: kronos_immuvis_v2
    format: immuvis
    path: /storage_ssd_3/immuvis_clinical/kronos_immuvis_v2_emb
    panels: [danenberg, cords]
    img_path_col: img_path
    batch_agg: mean
    patch_agg: mean
    variants: [scaled]
